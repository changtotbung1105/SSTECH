services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Security__ApiKey: ${PARTNER_API_KEY:?Copy .env.example to .env and set PARTNER_API_KEY}
      PartnerApi__BaseUrl: http://localhost:8080/
      RabbitMq__Uri: amqp://partner:local-demo-password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: partner
      RABBITMQ_DEFAULT_PASS: local-demo-password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq-data:
