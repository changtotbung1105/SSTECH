name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PartnerIntegration.sln
      - run: dotnet build PartnerIntegration.sln -c Release --no-restore
      - run: dotnet test PartnerIntegration.sln -c Release --no-build --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/**/TestResults/**/coverage.cobertura.xml
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      PARTNER_API_KEY: ci-demo-key
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 120
      - shell: pwsh
        run: ./scripts/Smoke-Test.ps1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
